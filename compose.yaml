version: '3.8'

services:
  ml-api:
    build: .
    ports:
      - "8001:8001"
    environment:
      - LLM_BASE_URL=http://host.docker.internal:11434/v1
      - LLM_API_KEY=ollama
      - LLM_MODEL=qwen2.5:7b
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    restart: unless-stopped